[project]
name = "thinking-filter"
version = "0.1.0"
description = "A naive Bayes word filter that estimates live how much of a draft is the student's own thinking, fitted to a G-Eval judge"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
