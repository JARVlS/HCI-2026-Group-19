name = "hci-backend"
main = "src/main.py"
compatibility_date = "2026-11-14"
compatibility_flags = ["python_workers"]

# D1 database (ADR-5), read in routes as request.scope["env"].DB.
# This is the group's real database in Leon's Cloudflare account (the id is not a secret). Local dev
# (`pywrangler dev`, `--local`) keeps its own copy under .wrangler/ and never touches it.
[[d1_databases]]
binding = "DB"
database_name = "hci-grp19"
database_id = "9e621484-9234-4802-9028-0edb484b9cca"
migrations_dir = "migrations"

# Plain config values, readable in routes via request.scope["env"]. Locally, .dev.vars overrides
# them. Secrets (ANTHROPIC_API_KEY, SESSION_SECRET, ADMIN_TOKEN) never go in this file: use
# `uv run pywrangler secret put NAME` or the dashboard, and locally .dev.vars (gitignored).
[vars]
ENVIRONMENT = "production"
# Stopgap since 16 Nov 2026, until the group's own Anthropic key exists: the model API is Claude in
# Amazon Bedrock (same Messages API, key in the secret ANTHROPIC_API_KEY). That account has no
# Sonnet 5.5 and no Haiku 5.5, so both tasks run on Sonnet 5. With an Anthropic key switch back to:
#   MODEL_CHAT = "claude-sonnet-5-5", MODEL_ANALYZE = "claude-haiku-5-5",
#   ANTHROPIC_BASE_URL = "https://api.anthropic.com"
MODEL_CHAT = "anthropic.claude-sonnet-5"
MODEL_ANALYZE = "anthropic.claude-sonnet-5"
# low, medium or high; "none" sends no effort (Claude Haiku 4.5 rejects the parameter with a 400).
EFFORT_CHAT = "low"
EFFORT_ANALYZE = "low"
MAX_TOKENS_CHAT = "4096"
MAX_TOKENS_JSON = "4096"
MAX_INPUT_CHARS = "200000"
DAILY_TOKEN_BUDGET = "200000"
# All users together, never resets. 900 000 tokens cost at most 10 USD on Sonnet 5 through Bedrock
# (worst case: every token billed as output at 11 USD per million). Raise it when the money is there.
TOTAL_TOKEN_BUDGET = "900000"
ANTHROPIC_BASE_URL = "https://bedrock-mantle.us-east-1.api.aws/anthropic"
