<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2c3e50" />
  <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round">
    <line x1="16" y1="9" x2="8" y2="23" />
    <line x1="16" y1="9" x2="24" y2="23" />
  </g>
  <!-- node colors match the independence scale: low, medium, high -->
  <circle cx="16" cy="9" r="5" fill="hsl(60, 70%, 50%)" />
  <circle cx="8" cy="23" r="5" fill="hsl(0, 70%, 50%)" />
  <circle cx="24" cy="23" r="5" fill="hsl(120, 70%, 50%)" />
</svg>
